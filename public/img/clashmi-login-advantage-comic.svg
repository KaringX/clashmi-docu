<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" xml:lang="zh-CN" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">APP 登录/绑定与订阅管理四格说明</title>
  <desc id="desc">四格中文信息图：原始订阅外传会暴露入口并可能连带影响相关用户；服务商编码或别名配合面板账号进行 APP 登录/绑定，可避免手动分发原始订阅；安全控制包括专属 UA、HWID、隐藏订阅和隐鄙节点入口；订阅代理、域名择优和消息通知帮助维持可用性与触达，消息通知可触达已登录/已绑定设备，协助入口变更。</desc>
  <defs>
    <style>
      .bg { fill: #f5f7fc; }
      .panel { fill: #ffffff; stroke: #263451; stroke-width: 3; }
      .kicker { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5273c8; letter-spacing: 1px; }
      .heading { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17233d; }
      .body { font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #34425d; }
      .small { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d5d79; }
      .tag { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17233d; }
      .tag-white { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .white { fill: #ffffff; }
      .line { fill: none; stroke: #263451; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #e35e68; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="820"/>
  <rect x="34" y="24" width="1132" height="76" rx="24" fill="#17233d"/>
  <text x="70" y="59" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#ffffff">登录对接，匿踪➕安全➕用户触达</text>
  <text x="70" y="84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#cbd7f6">从原始链接外传，到登录、控制与触达的分层处理</text>
  <rect x="997" y="44" width="132" height="34" rx="17" fill="#89d7bb"/>
  <text x="1063" y="67" text-anchor="middle" class="tag">四格说明</text>

  <!-- 1. Raw subscription leak -->
  <rect class="panel" x="34" y="122" width="546" height="282" rx="24"/>
  <text class="kicker" x="62" y="153">01 / 风险起点</text>
  <text class="heading" x="62" y="185">原始订阅外传</text>
  <rect x="68" y="211" width="182" height="112" rx="17" fill="#e9efff" stroke="#5273c8" stroke-width="2"/>
  <rect x="87" y="231" width="144" height="18" rx="7" fill="#5273c8"/>
  <rect x="87" y="261" width="118" height="12" rx="6" fill="#a9bce9"/>
  <rect x="87" y="285" width="92" height="12" rx="6" fill="#a9bce9"/>
  <text class="tag" x="159" y="313" text-anchor="middle">原始订阅链接</text>
  <path class="dash" d="M255 257 C304 230 331 227 365 238"/>
  <path class="dash" d="M255 278 C310 299 342 305 392 293"/>
  <circle cx="388" cy="234" r="27" fill="#a61b35"/>
  <text x="388" y="240" text-anchor="middle" class="tag-white">爬虫</text>
  <circle cx="420" cy="300" r="27" fill="#9b2c45"/>
  <text x="420" y="306" text-anchor="middle" class="tag-white">转售</text>
  <path class="line" d="M459 246 h62 m-14 -14 14 14 -14 14"/>
  <rect x="448" y="273" width="104" height="52" rx="14" fill="#fff1e9"/>
  <text class="small" x="500" y="296" text-anchor="middle">入口暴露</text>
  <text class="small" x="500" y="316" text-anchor="middle">连带影响</text>
  <text class="body" x="68" y="357">链接被爬取或转售后，入口会暴露；</text>
  <text class="body" x="68" y="383">异常也可能影响使用同一入口的相关用户。</text>

  <!-- 2. Login through aliases and panel account -->
  <rect class="panel" x="620" y="122" width="546" height="282" rx="24"/>
  <text class="kicker" x="648" y="153">02 / 登录入口</text>
  <text class="heading" x="648" y="185">APP 登录/绑定</text>
  <rect x="667" y="211" width="107" height="137" rx="18" fill="#1f2c48"/>
  <rect x="678" y="224" width="85" height="93" rx="10" fill="#e9efff"/>
  <circle cx="720" cy="333" r="6" fill="#ffffff"/>
  <text class="small" x="720" y="257" text-anchor="middle">APP</text>
  <rect x="683" y="274" width="74" height="24" rx="12" fill="#89d7bb"/>
  <text x="720" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#17233d">登录/绑定</text>
  <path class="line" d="M788 263 h38 m-12 -12 12 12 -12 12"/>
  <rect x="839" y="214" width="265" height="58" rx="15" fill="#fff7d7" stroke="#d5a934" stroke-width="2"/>
  <text class="tag" x="858" y="249">服务商编码或别名</text>
  <rect x="839" y="288" width="265" height="58" rx="15" fill="#e9efff" stroke="#5273c8" stroke-width="2"/>
  <text class="tag" x="858" y="323">面板账号</text>
  <text class="body" x="648" y="376">使用两项登录凭据，无需手动分发原始订阅。</text>

  <!-- 3. Configurable security controls -->
  <rect class="panel" x="34" y="430" width="546" height="282" rx="24"/>
  <text class="kicker" x="62" y="461">03 / 安全控制</text>
  <text class="heading" x="62" y="493">安全控制</text>
  <path d="M92 526 l43 18 v42 c0 31 -22 51 -43 59 -21 -8 -43 -28 -43 -59 v-42z" fill="#e9efff" stroke="#5273c8" stroke-width="3"/>
  <path class="line" d="M75 581 l12 12 23 -28"/>
  <rect x="169" y="522" width="168" height="48" rx="14" fill="#e9efff"/>
  <rect x="352" y="522" width="168" height="48" rx="14" fill="#e8f8f1"/>
  <rect x="169" y="585" width="168" height="48" rx="14" fill="#fff4df"/>
  <rect x="352" y="585" width="168" height="48" rx="14" fill="#f3ebff"/>
  <text class="tag" x="253" y="553" text-anchor="middle">专属 UA</text>
  <text class="tag" x="436" y="553" text-anchor="middle">HWID</text>
  <text class="tag" x="253" y="616" text-anchor="middle">隐藏订阅</text>
  <text class="tag" x="436" y="616" text-anchor="middle">隐鄙节点入口</text>
  <text class="body" x="62" y="675">专属 UA、HWID 与隐藏设置，降低不必要的暴露。</text>

  <!-- 4. Availability and outreach -->
  <rect class="panel" x="620" y="430" width="546" height="282" rx="24"/>
  <text class="kicker" x="648" y="461">04 / 可用性与触达</text>
  <text class="heading" x="648" y="493">可用性与触达</text>
  <circle cx="728" cy="563" r="43" fill="#5273c8"/>
  <circle cx="892" cy="563" r="43" fill="#89d7bb"/>
  <circle cx="1056" cy="563" r="43" fill="#f5c85c"/>
  <path class="line" d="M771 563 h72 m-13 -12 13 12 -13 12"/>
  <path class="line" d="M935 563 h72 m-13 -12 13 12 -13 12"/>
  <text x="728" y="558" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">订阅</text>
  <text x="728" y="580" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">代理</text>
  <text class="tag" x="892" y="558" text-anchor="middle">域名</text>
  <text class="tag" x="892" y="580" text-anchor="middle">择优</text>
  <text class="tag" x="1056" y="558" text-anchor="middle">消息</text>
  <text class="tag" x="1056" y="580" text-anchor="middle">通知</text>
  <text class="tag" x="728" y="630" text-anchor="middle">订阅代理</text>
  <text class="tag" x="892" y="630" text-anchor="middle">域名择优</text>
  <text class="tag" x="1056" y="630" text-anchor="middle">消息通知</text>
  <text class="body" x="648" y="675">消息通知可触达已登录/已绑定设备，协助入口变更。</text>

  <rect x="34" y="740" width="1132" height="52" rx="18" fill="#e8eefb"/>
  <circle cx="64" cy="766" r="12" fill="#5273c8"/>
  <text x="64" y="772" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#ffffff">i</text>
  <text class="small" x="88" y="771">增加体系防护强度，降低泄露风险、缩小影响，并提升变更后的恢复与触达能力。</text>
</svg>
